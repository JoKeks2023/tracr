name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop host needs WebKitGTK on Linux; it is built by the macOS job.
      - run: cargo clippy --workspace --exclude tracr-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude tracr-desktop

  macos:
    name: macOS (build, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the desktop UI (tauri embeds dist/)
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo build --workspace
      - run: cargo test --workspace

  windows:
    name: Windows (cargo check, non-host crates)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude tracr-cli --exclude tracr-desktop
