name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its running checks; pushes to
# branches always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop host needs WebKitGTK on Linux; it is built by the macOS job.
      - run: cargo clippy --workspace --exclude tracr-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude tracr-desktop

  ui-typecheck:
    name: Desktop UI (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Typecheck the desktop UI
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile && pnpm typecheck

  macos:
    name: macOS (build, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v5
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the desktop UI (tauri embeds dist/)
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo build --workspace
      - run: cargo test --workspace

  windows:
    name: Windows (cargo check, non-host crates)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude tracr-cli --exclude tracr-desktop
