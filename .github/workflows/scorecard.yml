# OpenSSF Scorecard: rates the repository's security practices, publishes
# the result to the public Scorecard API (badge) and uploads the findings to
# code scanning.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 3"
  # Re-run when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Publish the results to the Scorecard API.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
