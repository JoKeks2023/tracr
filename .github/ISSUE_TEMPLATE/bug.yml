name: Bug report
description: Something in tracr is wrong or surprising
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tracr version
      description: "`tracr --version`, or the version shown in the app"
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Desktop app, Command line, Import / ingest, Cost / pricing, Documentation, Other]
  - type: textarea
    id: output
    attributes:
      label: Output or screenshot
      description: Please leave out prompts, project names and anything private. tracr never needs them.
