# tracr pricing catalog (architecture §8.3, cost model §4).
#
# Values are list prices entered by hand from the official page below. They
# make an *API-equivalent estimate*, never spend. A rule matches the exact
# (provider, model, service tier, speed, inference geography); a model that is
# not listed here stays unpriced, never zero. Prices are per million tokens
# with at most three decimals (exactly nano-units per token).
#
# effective_from/effective_to are left unset: the page states current prices,
# not since when. Estimates therefore carry "catalog_as_of:<fetched_at>".
#
# Not modeled (no rule, so such usage is unpriced or stated as an assumption):
# Batch API, inference_geo "us" (1.1x), partner clouds (Bedrock, Vertex),
# code execution hours, Managed Agents session runtime.
# OpenAI (Codex): rules cover the standard short-context price only (input up
# to 272K tokens). The page prices longer inputs higher (input x2); that is
# not modeled, so a record above 272K input tokens would be underestimated.
# No Codex usage above 245K input tokens exists locally. Fast, Flex, Batch and
# cache-write prices are not modeled either. "default" is the service tier
# Codex records. Models the page does not list (e.g. codex-auto-review) stay
# unpriced.
# Claude Sonnet 5.5 is on the page, but its model ID is not verified here.

catalog_version = "2026-10-24.1"
currency = "USD"

[[sources]]
id = "anthropic-pricing"
url = "https://platform.claude.com/docs/en/about-claude/pricing"
fetched_at = "2026-10-01"

[[sources]]
id = "openai-pricing"
url = "https://developers.openai.com/api/docs/pricing"
fetched_at = "2026-10-24"

[tier_categories]
ephemeral_5m_input_tokens = "cache_write_5m"
ephemeral_1h_input_tokens = "cache_write_1h"

[[rules]]
id = "claude-fable-5-1/standard"
provider = "claude_code"
model = "claude-fable-5-1"
service_tier = "standard"
speed = "standard"
inference_geo = "global"
source = "anthropic-pricing"
per_mtok = { input = "10", cache_write_5m = "12.50", cache_write_1h = "20", cache_read = "0.25", output = "50" }
per_unit = { web_search_requests = "0.01", web_fetch_requests = "0" }

