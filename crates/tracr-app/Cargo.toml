[package]
name = "tracr-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
jiff = "0.2.37"
notify = "8"
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
tracr-core = { version = "0.9.2", path = "../tracr-core" }
tracr-git = { version = "0.9.2", path = "../tracr-git" }
tracr-ingest = { version = "0.9.2", path = "../tracr-ingest" }
tracr-platform = { version = "0.9.2", path = "../tracr-platform" }
tracr-provider-claude = { version = "0.9.2", path = "../tracr-provider-claude" }
tracr-provider-codex = { version = "0.9.2", path = "../tracr-provider-codex" }
tracr-store = { version = "0.9.2", path = "../tracr-store" }
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
ruzstd = "0.9.1"
tracr-testkit = { path = "../tracr-testkit" }
